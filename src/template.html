<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floor plan editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #ffffff;
  --desk: #e9edf0;
  --graphite: #2a2d33;
  --graphite-2: #5b616b;
  --rule: #cfd5db;
  --pencil-blue: #2f5fd0;
  --marker: #f2c230;
  --marker-soft: #fbe9a6;
  --red-pencil: #c8372d;
  --green-pencil: #2e7d4f;
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); font-size: 14px; line-height: 1.45; color: var(--graphite);
  background: var(--desk); display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pencil-blue); outline-offset: 2px; }

/* ---------- toolbar ---------- */
header {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 16px; background: var(--paper); border-bottom: 1px solid var(--rule);
}
header h1 {
  margin: 0 8px 0 0; font-size: 17px; font-weight: 700; font-stretch: 75%; letter-spacing: .01em;
}
.tg { display: flex; align-items: center; gap: 6px; }
.tg + .tg { padding-left: 12px; border-left: 1px solid var(--rule); }
.btn {
  border: 1px solid var(--rule); background: var(--paper); border-radius: 4px; padding: 4px 10px;
  cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--graphite-2); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--graphite); color: #fff; border-color: var(--graphite); }
.btn.danger { color: var(--red-pencil); }
.seg-ctl { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.seg-ctl button { border: 0; background: none; padding: 4px 10px; cursor: pointer; }
.seg-ctl button[aria-pressed="true"] { background: var(--graphite); color: #fff; }
header input[type=number] { width: 64px; }
header select { max-width: 170px; }
header input[type=number] { width: 52px; }
input[type=number], input[type=text], select {
  border: 1px solid var(--rule); border-radius: 4px; padding: 3px 6px; background: var(--paper);
}
label.chk { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.muted { color: var(--graphite-2); }

/* ---------- layout ---------- */
main { display: grid; grid-template-columns: 1fr 370px; min-height: 0; }
#stage { position: relative; min-width: 0; min-height: 0; }
#plan { width: 100%; height: 100%; display: block; background: var(--paper); cursor: default; user-select: none; }
#plan.panning { cursor: grabbing; }
#hint {
  position: absolute; left: 14px; bottom: 12px; font-size: 12.5px; color: var(--graphite-2);
  background: rgba(255,255,255,.9); padding: 4px 8px; border-radius: 4px; pointer-events: none;
}
#notice {
  position: absolute; left: 14px; top: 12px; max-width: 560px; background: #fff; padding: 8px 12px;
  border-left: 3px solid var(--pencil-blue); border-radius: 3px; box-shadow: 0 1px 2px rgba(42,45,51,.15); font-size: 13px;
}
#notice.err { border-left-color: var(--red-pencil); }
#notice[hidden] { display: none; }
aside {
  background: var(--paper); border-left: 1px solid var(--rule); overflow-y: auto; padding: 18px 18px 40px;
}
aside h2 { margin: 0 0 2px; font-size: 19px; font-weight: 700; font-stretch: 80%; }
aside h3 { margin: 20px 0 8px; font-size: 14px; font-weight: 650; }
aside p { margin: 6px 0; }
.sub { color: var(--graphite-2); margin-bottom: 14px; }
.row { display: grid; grid-template-columns: 88px auto 1fr; align-items: center; gap: 8px; margin: 7px 0; }
.row > label { color: var(--graphite-2); }
.stepper { display: inline-flex; align-items: stretch; }
.stepper input { width: 72px; -moz-appearance: textfield; }
.stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.stepper input { text-align: right; border-radius: 0; }
.stepper button {
  width: 26px; border: 1px solid var(--rule); background: var(--desk); cursor: pointer; padding: 0;
}
.stepper button:first-child { border-radius: 4px 0 0 4px; border-right: 0; }
.stepper button:last-of-type { border-radius: 0 4px 4px 0; border-left: 0; }
.unit { margin-left: 5px; color: var(--graphite-2); }
.conv { color: var(--graphite-2); font-size: 12.5px; text-align: right; white-space: nowrap; }
.row select, .row input[type=text] { width: 100%; }
.actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.errs { margin-top: 12px; color: var(--red-pencil); font-size: 13px; }
.errs p { margin: 4px 0; padding-left: 10px; border-left: 2px solid var(--red-pencil); }
.impact { margin-top: 10px; font-size: 13px; }
.impact .swatch { display: inline-block; width: 12px; height: 12px; background: var(--marker); vertical-align: -1px; margin-right: 6px; border-radius: 2px; }
.addon-card { border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px 8px; margin: 8px 0; }
.addon-card .row { grid-template-columns: 70px auto 1fr; }
.addon-head { display: flex; justify-content: space-between; align-items: center; }
.legend { margin-top: 18px; font-size: 13px; color: var(--graphite-2); }
.legend div { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
.legend i { display: inline-block; width: 22px; height: 10px; border-radius: 2px; }
.lockbox { margin-top: 14px; padding: 12px; border: 1px dashed var(--rule); border-radius: 6px; }
kbd { font: inherit; font-size: 12px; border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; background: var(--desk); }

/* ---------- plan drawing ---------- */
.room { fill: #fbfbf9; }
.room.outdoor { fill: #eceeea; }
.room.hl { fill: var(--marker-soft); }
.roomlabel { fill: var(--graphite-2); font-weight: 650; font-stretch: 85%; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.wall { fill: var(--graphite); cursor: pointer; }
.wall:hover { fill: #4b515a; }
.wall.hl { fill: var(--marker); }
.wall.sel { fill: var(--pencil-blue); }
.opening { cursor: pointer; }
.opening .gap { fill: #fff; stroke: var(--graphite); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.opening .wl { stroke: var(--graphite); stroke-width: 1px; vector-effect: non-scaling-stroke; pointer-events: none; }
.opening .leaf { stroke: var(--graphite); stroke-width: 2px; vector-effect: non-scaling-stroke; }
.opening .arc { fill: none; stroke: var(--graphite-2); stroke-width: 1px; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; pointer-events: none; }
.opening:hover .gap { fill: #eef1f4; }
.opening.hl .gap { fill: var(--marker); }
.opening.sel .gap { fill: #d8e3fb; stroke: var(--pencil-blue); }
.opening.sel .leaf { stroke: var(--pencil-blue); }
.obj .body { fill: #fff; fill-opacity: .94; stroke: #55606e; stroke-width: 1.5px; vector-effect: non-scaling-stroke; cursor: grab; }
.obj.locked .body { fill: #eeefea; stroke: #8e9188; cursor: pointer; }
.obj:hover .body { stroke: var(--graphite); }
.obj.hl .body { fill: var(--marker-soft); stroke: #b8901a; stroke-width: 2.5px; }
.obj.oob .body { fill: #fde4e1; stroke: var(--red-pencil); stroke-dasharray: 6 3; }
.obj.sel .body { stroke: var(--pencil-blue); stroke-width: 2.5px; }
.obj.dragging .body { cursor: grabbing; }
.addon { fill: #e4e9ef; stroke: #55606e; stroke-width: 1px; vector-effect: non-scaling-stroke; }
.objlabel { fill: var(--graphite); text-anchor: middle; dominant-baseline: middle; pointer-events: none; font-stretch: 85%; }
.addonlabel { fill: var(--graphite-2); text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.hovering { fill: none; stroke: var(--red-pencil); stroke-width: 1.5px; vector-effect: non-scaling-stroke; pointer-events: none; }
.dim line { stroke: var(--red-pencil); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.dim text { fill: var(--red-pencil); stroke: #fff; paint-order: stroke; stroke-linejoin: round; font-stretch: 85%; }
.dim.clear line { stroke: var(--green-pencil); }
.dim.clear text { fill: var(--green-pencil); }
.dim.meta text { fill: var(--graphite-2); }
#overlay { pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Floor plan editor</h1>
  <div class="tg">
    <button class="btn" id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn" id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
    <button class="btn" id="fit" title="Fit the plan to the window">Fit</button>
  </div>
  <div class="tg">
    <span class="seg-ctl" role="group" aria-label="Display units">
      <button id="u-metric" aria-pressed="true">Metric</button>
      <button id="u-imperial" aria-pressed="false">Imperial</button>
    </span>
  </div>
  <div class="tg">
    <label class="chk"><input type="checkbox" id="snap"> Snap to walls</label>
    <label class="chk">gap <input type="number" id="gap" min="0" step="1"> cm</label>
  </div>
  <div class="tg">
    <select id="preset" aria-label="Object to add"></select>
    <button class="btn" id="add-obj">Add object</button>
  </div>
  <div class="tg">
    <button class="btn" id="import">Import JSON</button>
    <input type="file" id="import-file" accept=".json,application/json" hidden>
    <button class="btn" id="export-json">Export JSON</button>
    <button class="btn" id="export-svg">Export SVG</button>
    <label class="chk"><input type="checkbox" id="export-dims"> with dimensions</label>
  </div>
</header>
<main>
  <div id="stage">
    <svg id="plan" xmlns="http://www.w3.org/2000/svg">
      <g id="drawing"></g>
      <g id="overlay"></g>
    </svg>
    <div id="notice" role="status" hidden></div>
    <div id="hint">Scroll to zoom, drag empty space to pan, hover anything to see its measurements.</div>
  </div>
  <aside id="panel"></aside>
</main>
<script type="application/json" id="baseline">/*BASELINE*/</script>
<script>/*CORE*/</script>
<script>/*UI*/</script>
</body>
</html>
